Description: 'Static website using S3'
AWSTemplateFormatVersion: "2010-09-09"

Resources:
  S3Bucket: #creating an S3 bucket to host the static website
    Type: AWS::S3::Bucket
    Properties:
      BucketName: 'my-static-website-andersjr' #global unique name for the bucket
      VersioningConfiguration:
        Status: Enabled #enable versioning for the bucket
      WebsiteConfiguration:
        IndexDocument: index.html #webpage index document
      PublicAccessBlockConfiguration: #allow public access to the bucket for website hosting
        RestrictPublicBuckets: false
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        


  S3BucketPolicy: #creating a bucket policy to allow public read access to the S3 bucket
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket #reference to the S3 bucket created above
      PolicyDocument:
        Version: '2012-10-17'
        Statement: #allow public read access to the S3 bucket
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${S3Bucket.Arn}/*' #substitute the S3 bucket ARN to allow access to all objects in the bucket

Outputs: #output the URL of the static website
  WebsiteURL:
    Description: 'URL of the static website'
    Value: !GetAtt S3Bucket.WebsiteURL #get the website URL from the S3 bucket attributes