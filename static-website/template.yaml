Description: 'Static website using S3'
AWSTemplateFormatVersion: "2010-09-09"
Transform: S3Objects
Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: 'my-static-website-andersjr'
      VersioningConfiguration:
        Status: Enabled
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        RestrictPublicBuckets: false
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        
  WebsiteObject:
    Type: AWS::S3::Object
    Properties:
      Target:
        Bucket: !Ref S3Bucket
        Key: index.html
      ContentType: text/html
      Body: |
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>CloudFormation Lab</title>
        </head>
        <body>
          <h1>Jacob Anderson</h1>
          <h2>L00205577</h2>
          <h3>ATU PgDip DevOps</h3>
          <p>CloudFormation Lab Assignment</p>
        </body>
        </html>

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${S3Bucket.Arn}/*'

Outputs:
  WebsiteURL:
    Description: 'URL of the static website'
    Value: !GetAtt S3Bucket.WebsiteURL